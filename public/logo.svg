<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 172" fill="none">
  <!-- Outer border -->
  <rect x="2" y="28" width="416" height="142" stroke="currentColor" stroke-width="2.5"/>
  <!-- Inner border -->
  <rect x="7" y="33" width="406" height="132" stroke="currentColor" stroke-width="1"/>

  <!-- Chef hat (top center, breaking through border) -->
  <g transform="translate(210, 14)">
    <!-- Hat body -->
    <ellipse cx="0" cy="6" rx="12" ry="5" fill="currentColor"/>
    <rect x="-10" y="4" width="20" height="10" fill="currentColor" rx="1"/>
    <rect x="-8" y="13" width="16" height="4" fill="currentColor" rx="1"/>
    <!-- Hat puff top -->
    <ellipse cx="-6" cy="2" rx="6" ry="7" fill="currentColor"/>
    <ellipse cx="0" cy="-1" rx="7" ry="8" fill="currentColor"/>
    <ellipse cx="6" cy="2" rx="6" ry="7" fill="currentColor"/>
  </g>

  <!-- Crossed fork and spatula -->
  <!-- Fork (left) -->
  <g transform="translate(186, 8) rotate(-35, 10, 30)">
    <rect x="9" y="20" width="2.5" height="28" fill="currentColor" rx="1"/>
    <rect x="6" y="8" width="1.5" height="14" fill="currentColor" rx="0.5"/>
    <rect x="9" y="8" width="1.5" height="14" fill="currentColor" rx="0.5"/>
    <rect x="12" y="8" width="1.5" height="14" fill="currentColor" rx="0.5"/>
    <rect x="6" y="8" width="9" height="2" fill="currentColor" rx="0.5"/>
  </g>
  <!-- Spatula (right) -->
  <g transform="translate(222, 8) rotate(35, 10, 30)">
    <rect x="9" y="20" width="2.5" height="28" fill="currentColor" rx="1"/>
    <rect x="3" y="6" width="14" height="16" fill="currentColor" rx="1"/>
    <rect x="5" y="6" width="10" height="2" fill="none" stroke="currentColor" stroke-width="0.5"/>
    <rect x="5" y="9" width="10" height="2" fill="none" stroke="currentColor" stroke-width="0.5"/>
    <rect x="5" y="12" width="10" height="2" fill="none" stroke="currentColor" stroke-width="0.5"/>
    <rect x="5" y="15" width="10" height="2" fill="none" stroke="currentColor" stroke-width="0.5"/>
  </g>

  <!-- HEMINGWAYS text -->
  <text
    x="210"
    y="95"
    text-anchor="middle"
    font-family="'Arial Narrow', Arial, sans-serif"
    font-size="54"
    font-weight="900"
    letter-spacing="-1"
    fill="currentColor"
  >HEMINGWAYS</text>

  <!-- Divider lines around LAKESIDE -->
  <line x1="20" y1="108" x2="138" y2="108" stroke="currentColor" stroke-width="1.2"/>
  <line x1="20" y1="111" x2="138" y2="111" stroke="currentColor" stroke-width="0.5"/>
  <text
    x="210"
    y="114"
    text-anchor="middle"
    font-family="'Arial Narrow', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="6"
    fill="currentColor"
  >LAKESIDE</text>
  <line x1="282" y1="108" x2="400" y2="108" stroke="currentColor" stroke-width="1.2"/>
  <line x1="282" y1="111" x2="400" y2="111" stroke="currentColor" stroke-width="0.5"/>

  <!-- Bottom black bar -->
  <rect x="7" y="120" width="406" height="40" fill="currentColor"/>
  <text
    x="210"
    y="146"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="18"
    font-style="italic"
    letter-spacing="2"
    fill="white"
  >restaurant &amp; Bar</text>
</svg>
